<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="canciones-data.js"></script>
<script>
(function () {
  const cont = document.getElementById("songs");
  const songs = window.CANCIONES || [];
  cont.innerHTML = songs.map((s, i) => `
    <article class="song${i === 0 ? " open" : ""}" data-song>
      <button class="song__head" aria-expanded="${i === 0}">
        <span class="song__num">${String(i + 1).padStart(2, "0")}</span>
        <span class="song__title">${s.titulo}</span>
        ${s.audio ? '<span class="song__badge"><i data-lucide="volume-2"></i> Con audio</span>' : ""}
        <span class="song__chev"><i data-lucide="chevron-down"></i></span>
      </button>
      <div class="song__body">
        <div class="song__inner">
          ${s.audio ? `<div class="song__player"><audio controls preload="none" src="${s.audio}"></audio></div>` : ""}
          ${s.estrofas.map((e) => `<div class="estrofa">${e.map((l) => `<p>${l}</p>`).join("")}</div>`).join("")}
        </div>
      </div>
    </article>`).join("");

  // acordeón
  cont.querySelectorAll("[data-song]").forEach((song) => {
    const head = song.querySelector(".song__head");
    const body = song.querySelector(".song__body");
    const setH = () => { body.style.maxHeight = song.classList.contains("open") ? body.scrollHeight + "px" : "0px"; };
    if (song.classList.contains("open")) requestAnimationFrame(setH);
    head.addEventListener("click", () => {
      const open = song.classList.toggle("open");
      head.setAttribute("aria-expanded", open);
      setH();
    });
  });

  // nav
  const nav = document.getElementById("nav"), sb = document.getElementById("scrollbar");
  addEventListener("scroll", () => {
    const h = document.documentElement.scrollHeight - innerHeight;
    sb.style.width = (h > 0 ? (scrollY / h) * 100 : 0) + "%";
  }, { passive: true });
  document.getElementById("navToggle").addEventListener("click", () =>
    document.getElementById("navLinks").classList.toggle("open"));

  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
